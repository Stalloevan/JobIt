name: Probe boards

on:
  push:
    branches: [main]
    paths: ['.github/probe-run']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Greenhouse
        run: |
          out=""
          for t in formlabs desktopmetal markforged ginkgobioworks wayfair toast hubspot locusrobotics vecnarobotics flexport samsara relativity flyzipline impossiblefoods bostondynamics carbonrobotics sunrun nuro instacart doordash lyft chewy warbyparker allbirds faire plaid hadrian divergent redwoodmaterials formenergy beamtherapeutics klaviyo devotedhealth springhealth drift stripe airbnb figma databricks gusto brex affirm robinhood coinbase datadog mongodb elastic asana okta twilio cloudflare squarespace carvana opendoor zillow peloton rivian lucidmotors joby wing waymo gitlab discord duolingo thumbtack reddit pinterest; do
            code=$(curl -s -m 20 -o /tmp/r.json -w '%{http_code}' "https://boards-api.greenhouse.io/v1/boards/$t/jobs")
            if [ "$code" = "200" ]; then
              total=$(jq '.jobs|length' /tmp/r.json)
              rel=$(jq '[.jobs[]|select((.title|test("operations|quality|supply chain|industrial|process|manufactur|logistics|analyst|systems engineer|continuous improvement";"i")) and (((.location.name // "")|test(", MA|, RI|, CT")) or ((.location.name // "")|test("boston|remote|providence|massachusetts|rhode island|cambridge|worcester|connecticut";"i"))))]|length' /tmp/r.json)
              out="$out$t total=$total relevant=$rel%0A"
            fi
          done
          echo "::notice title=Greenhouse results::$out"

      - name: Lever
        run: |
          out=""
          for t in plaid spotify wealthfront kiva rover outreach matternet zoox ouster brightmachines gecko-robotics geckorobotics paxos anchorage mistral shieldai samsara-inc ro nerdwallet zeta netflix box lucidmotors relativityspace vicarioussurgical neurala nuvation sword-health sword; do
            code=$(curl -s -m 20 -o /tmp/r.json -w '%{http_code}' "https://api.lever.co/v0/postings/$t?mode=json")
            if [ "$code" = "200" ]; then
              total=$(jq 'length' /tmp/r.json)
              rel=$(jq '[.[]|select((.text|test("operations|quality|supply chain|industrial|process|manufactur|logistics|analyst|systems engineer|continuous improvement";"i")) and (((.categories.location // "")|test(", MA|, RI|, CT")) or ((.categories.location // "")|test("boston|remote|providence|massachusetts|rhode island|cambridge|worcester|connecticut";"i"))))]|length' /tmp/r.json)
              out="$out$t total=$total relevant=$rel%0A"
            fi
          done
          echo "::notice title=Lever results::$out"
