name: Build JobIt

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Build (unsigned)
        run: >
          xcodebuild -project JobIt.xcodeproj -scheme JobIt
          -configuration Release -sdk iphoneos -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/JobIt.app Payload/
          zip -r "JobIt-v${{ steps.ver.outputs.version }}.ipa" Payload

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.ver.outputs.version }}"
          "JobIt-v${{ steps.ver.outputs.version }}.ipa"
          --title "JobIt v${{ steps.ver.outputs.version }}"
          --target "${{ github.sha }}"
